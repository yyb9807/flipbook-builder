# 三服务编排：postgres + backend (FastAPI) + frontend (nginx 静态 + 反代)
#
# 使用：
#   docker compose up -d --build
#   docker compose logs -f backend
#   docker compose down               # 停止但保留卷
#   docker compose down -v            # 删除数据库卷；宿主机 ./data 图片仍保留
#
# 访问：http://localhost:${FRONTEND_PORT:-8080}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      # 仍暴露到宿主机 5434，方便本地连库调试；线上可去掉
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flipbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flipbook}
      POSTGRES_DB: ${POSTGRES_DB:-flipbook}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flipbook}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.13-slim}
    restart: unless-stopped
    environment:
      # 容器内连库走 service 名 + 默认端口 5432
      DATABASE_URL: postgresql://${POSTGRES_USER:-flipbook}:${POSTGRES_PASSWORD:-flipbook}@db:5432/${POSTGRES_DB:-flipbook}
      # 前后端同源；仅为本地开发声明跨域来源。
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://127.0.0.1:5173}
      # LLM / 图片生成默认值；前端请求 header 会覆盖（用户在设置页填的 key）
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.anthropic.com}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-6}
      IMG_GEN_API_KEY: ${IMG_GEN_API_KEY:-}
      IMG_GEN_BASE_URL: ${IMG_GEN_BASE_URL:-https://api.openai.com/v1}
      IMG_GEN_MODEL: ${IMG_GEN_MODEL:-dall-e-3}
    volumes:
      # 上传图片 + 缓存图片持久化到宿主机 ./data
      - ./data:/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
